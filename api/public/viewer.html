<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunPath viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #1c2230;
    --muted: #667085;
    --line: #e4e7ec;
    --accent: #2459d8;
    --danger: #c0362c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  form { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 500; }
  label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  input, select {
    font: inherit; color: var(--ink);
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 9px 12px; border-radius: 7px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.secondary { background: #fff; color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); min-height: 1.45em; }
  #status.error { color: var(--danger); }

  ol { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .card {
    display: block; width: 100%; text-align: left;
    background: #fff; color: var(--ink); font-weight: 400;
    border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 12px 11px 14px; margin-bottom: 8px; position: relative;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px;
    border-radius: 0 3px 3px 0; background: var(--swatch);
  }
  .card[aria-pressed="true"] { border-color: var(--swatch); box-shadow: 0 0 0 1px var(--swatch); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank { font-weight: 700; font-size: 15px; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .score b { color: var(--ink); font-size: 14px; }
  .headline { margin: 3px 0 6px; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 12.5px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .gmaps { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--accent); }
  .more { padding: 0 8px 12px; }
  .more button { width: 100%; }
  .empty { color: var(--muted); padding: 16px 8px; font-size: 13px; }

  #map { height: 100%; }
  .legend {
    background: #fff; padding: 7px 10px; border-radius: 7px; font-size: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18); line-height: 1.6;
  }
  .legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 4px solid #333; }
  .legend i.dash { border-top: 3px dashed #333; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
    ol { max-height: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <form id="form">
      <h1>RunPath <span>route viewer</span></h1>
      <label>Start address
        <input name="address" required autocomplete="street-address"
               value="1011 S Bagdad Rd, Leander, TX 78641">
      </label>
      <div class="row">
        <label>Distance (mi)
          <input name="distanceMi" type="number" step="0.1" min="0.5" max="30" value="2" required>
        </label>
        <label>Path type
          <select name="pathType">
            <option value="loop">Loop</option>
            <option value="out_and_back">Out &amp; back</option>
          </select>
        </label>
      </div>
      <label id="approachField">Max distance to loop start (mi)
        <input name="maxApproachMi" type="number" step="0.1" min="0" max="5" value="0.4">
      </label>
      <button type="submit" id="submit">Find routes</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <ol id="results"><li class="empty">Enter an address and search. Routes draw on the map; click one to zoom in.</li></ol>
    <div class="more"><button type="button" class="secondary" id="next" hidden>Next 5 routes</button></div>
  </aside>
  <div id="map" aria-label="Route map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const PAGE_SIZE = 5;
  const COLORS = ["#d6336c", "#2b8a3e", "#1c64d8", "#e8590c", "#8e3fb8"];
  const ROAD_LABELS = {
    residential: "residential street",
    living_street: "living street",
    footway: "footpath",
    pedestrian: "pedestrian way",
    path: "trail",
    track: "dirt track",
    cycleway: "bike path",
    bridleway: "bridleway",
    steps: "steps",
    service: "service road",
    unclassified: "minor road",
    tertiary: "collector road",
    secondary: "arterial",
    primary: "major arterial",
  };

  const map = L.map("map").setView([30.55, -97.85], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);

  const legend = L.control({ position: "bottomleft" });
  legend.onAdd = () => {
    const el = L.DomUtil.create("div", "legend");
    el.innerHTML = '<div><i></i>Route</div><div><i class="dash"></i>Walk to loop start</div>';
    return el;
  };
  legend.addTo(map);
  window.addEventListener("resize", () => map.invalidateSize());

  const layers = L.layerGroup().addTo(map);
  const els = {
    form: document.getElementById("form"),
    submit: document.getElementById("submit"),
    status: document.getElementById("status"),
    results: document.getElementById("results"),
    next: document.getElementById("next"),
    approachField: document.getElementById("approachField"),
  };

  const state = { request: null, page: 1, candidates: [], home: null, selected: 0, lines: [] };

  const toLatLngs = (coords) => coords.map(([lon, lat]) => [lat, lon]);
  const mi = (n) => `${n.toFixed(2)} mi`;
  const pct = (n) => `${Math.round(n * 100)}%`;

  function setStatus(text, isError = false) {
    els.status.textContent = text;
    els.status.classList.toggle("error", isError);
  }

  function syncApproachField() {
    els.approachField.hidden = els.form.pathType.value === "out_and_back";
  }
  els.form.pathType.addEventListener("change", syncApproachField);
  syncApproachField();

  function readForm() {
    const f = els.form;
    const req = {
      address: f.address.value.trim(),
      distanceMi: Number(f.distanceMi.value),
      pathType: f.pathType.value,
    };
    if (req.pathType === "loop") req.maxApproachMi = Number(f.maxApproachMi.value);
    return req;
  }

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    state.request = readForm();
    state.page = 1;
    search();
  });
  els.next.addEventListener("click", () => {
    state.page += 1;
    search();
  });

  async function search() {
    els.submit.disabled = true;
    els.next.disabled = true;
    setStatus("Searching…");
    const t0 = performance.now();
    try {
      const res = await fetch("/search", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ...state.request, page: state.page }),
      });
      const body = await res.json();
      if (!res.ok) {
        const detail = typeof body.detail === "string" ? body.detail : body.error;
        throw new Error(detail || `Request failed (${res.status})`);
      }
      state.candidates = body.candidates;
      state.home = body.home;
      state.selected = 0;

      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      const first = (state.page - 1) * PAGE_SIZE + 1;
      const last = first + body.candidates.length - 1;
      // Say why a search came back thin: right-length routes that broke a rule.
      const rejected = Object.entries(body.rejected ?? {})
        .sort((a, b) => b[1] - a[1])
        .map(([reason, n]) => `${n} ${reason}`)
        .join(", ");
      const why = rejected ? ` Right length but excluded: ${rejected}.` : "";
      setStatus(
        body.totalFound === 0
          ? `No routes matched within ±0.1 mi (${secs}s).${why}`
          : `${body.totalFound} routes found in ${secs}s · showing ${first}–${last}.${why}`,
      );
      els.next.hidden = state.page * PAGE_SIZE >= body.totalFound;
      render();
      fitAll();
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      els.submit.disabled = false;
      els.next.disabled = false;
    }
  }

  // Leaflet caches the container size. If it was measured while the page was
  // hidden or mid-resize, fitBounds divides by ~0 and jumps to max zoom, which
  // shows a single blank tile. Re-measure before every fit.
  function fitTo(bounds, padding) {
    map.invalidateSize();
    const size = map.getSize();
    if (size.x < 50 || size.y < 50) {
      // Still not laid out; try again once the browser has painted.
      requestAnimationFrame(() => fitTo(bounds, padding));
      return;
    }
    map.fitBounds(bounds, { padding: [padding, padding], maxZoom: 17 });
  }

  function select(i) {
    state.selected = i;
    render();
    const line = state.lines[i];
    if (line) fitTo(line.getBounds(), 40);
  }

  function fitAll() {
    if (!state.lines.length) return;
    const bounds = L.latLngBounds([]);
    for (const l of state.lines) bounds.extend(l.getBounds());
    if (state.home) bounds.extend([state.home.lat, state.home.lon]);
    fitTo(bounds, 30);
  }

  function render() {
    layers.clearLayers();
    state.lines = [];

    // Draw unselected first so the selected route always sits on top.
    const order = state.candidates.map((_, i) => i).filter((i) => i !== state.selected);
    if (state.candidates.length) order.push(state.selected);

    for (const i of order) {
      const c = state.candidates[i];
      const color = COLORS[i % COLORS.length];
      const sel = i === state.selected;

      if (c.approachCoordinates.length) {
        L.polyline(toLatLngs(c.approachCoordinates), {
          color, weight: sel ? 4 : 2, opacity: sel ? 0.9 : 0.3, dashArray: "6 8",
        }).addTo(layers);
      }
      const line = L.polyline(toLatLngs(c.coordinates), {
        color, weight: sel ? 6 : 3, opacity: sel ? 0.95 : 0.35,
      }).addTo(layers);
      line.on("click", () => select(i));
      state.lines[i] = line;

      if (sel && c.coordinates.length) {
        const [lon, lat] = c.coordinates[0];
        L.circleMarker([lat, lon], {
          radius: 7, color, weight: 3, fillColor: "#fff", fillOpacity: 1,
        }).bindTooltip(c.pathType === "loop" ? "Loop start" : "Start").addTo(layers);
      }
    }

    if (state.home) {
      L.circleMarker([state.home.lat, state.home.lon], {
        radius: 6, color: "#111", weight: 2, fillColor: "#111", fillOpacity: 1,
      }).bindTooltip("Your address").addTo(layers);
    }

    renderList();
  }

  function roadSummary(mix) {
    return Object.entries(mix)
      .filter(([, v]) => v >= 0.05)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([k, v]) => `${ROAD_LABELS[k] ?? k.replace(/_/g, " ")} ${pct(v)}`)
      .join(", ");
  }

  function renderList() {
    els.results.replaceChildren();
    if (!state.candidates.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No routes to show.";
      els.results.append(li);
      return;
    }

    state.candidates.forEach((c, i) => {
      const m = c.metrics;
      const rank = (state.page - 1) * PAGE_SIZE + i + 1;
      const isLoop = c.pathType === "loop";

      const li = document.createElement("li");
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.style.setProperty("--swatch", COLORS[i % COLORS.length]);
      card.setAttribute("aria-pressed", String(i === state.selected));
      card.addEventListener("click", () => select(i));

      const head = document.createElement("div");
      head.className = "card-head";
      const r = document.createElement("span");
      r.className = "rank";
      r.textContent = `#${rank}`;
      const s = document.createElement("span");
      s.className = "score";
      s.innerHTML = `score <b></b>`;
      s.querySelector("b").textContent = c.score.toFixed(1);
      head.append(r, s);

      const headline = document.createElement("div");
      headline.className = "headline";
      headline.textContent = isLoop
        ? `${mi(c.loopDistanceMi)} loop · starts ${mi(c.approachDistanceMi)} away`
        : `${mi(c.loopDistanceMi)} out & back · from your door`;

      const rows = [
        ["One lap", isLoop ? `${mi(c.singleLapTotalMi)} total incl. walk to start` : mi(c.loopDistanceMi)],
        ["Climb", `${Math.round(m.elevationGainFt)} ft`],
        ["Roads", roadSummary(m.roadClassMix) || "—"],
        ["Car-free", pct(m.pathPct)],
        ["Busy crossings", String(m.crossingsOfMajorRoads)],
      ];
      if (isLoop) {
        const doubledFt = Math.round(m.retracePct * m.distanceMi * 5280);
        rows.push(["Doubles back", doubledFt < 10 ? "never" : `${doubledFt} ft`]);
      }
      const dl = document.createElement("dl");
      for (const [k, v] of rows) {
        const dt = document.createElement("dt");
        dt.textContent = k;
        const dd = document.createElement("dd");
        dd.textContent = v;
        dl.append(dt, dd);
      }

      card.append(head, headline, dl);
      li.append(card);

      if (c.googleMapsUrl) {
        const a = document.createElement("a");
        a.className = "gmaps";
        a.href = c.googleMapsUrl;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Open in Google Maps ↗ (approximate path)";
        li.append(a);
      }
      els.results.append(li);
    });
  }
</script>
</body>
</html>
